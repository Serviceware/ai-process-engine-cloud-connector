name: Set up Node.js and pnpm
description: Install Node.js from .node-version, pnpm through Corepack, and the locked dependencies with a cached pnpm store.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version

    # setup-node's pnpm cache needs pnpm before Node.js is installed; Corepack only provides it afterwards.
    - name: Enable pnpm
      id: pnpm
      shell: bash
      run: |
        corepack enable
        echo "store=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-pnpm-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
