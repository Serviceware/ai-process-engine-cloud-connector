version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Majors follow Node.js 24: its types, and the undici it bundles, which uses this dispatcher.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: undici
        update-types:
          - version-update:semver-major
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
