name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changesets:
    name: Changeset status
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Require a release or empty Changeset
        run: pnpm run changeset:status --since="origin/${{ github.base_ref }}"

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Check whitespace
        run: git diff --check

      # Dependabot bumps the Dockerfile but not .node-version.
      - name: Check Node.js version matches the container image
        run: |
          image="$(sed -n 's/^FROM node:\([0-9][0-9.]*\)-.*/\1/p' Dockerfile)"
          pinned="$(tr -d '[:space:]' < .node-version)"
          if [[ -z "${image}" || "${image}" != "${pinned}" ]]; then
            echo "::error file=.node-version::.node-version is '${pinned}' but the Dockerfile uses node:${image:-<none>}; set both to the same version."
            exit 1
          fi

      - name: Check formatting
        run: pnpm run fmt:check

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Run tests with coverage
        run: pnpm run test:coverage --reporter=default --reporter=junit --outputFile.junit=test-results.xml

      - name: Run integration tests
        run: pnpm run test:integration --reporter=default --reporter=junit --outputFile.junit=integration-test-results.xml

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_attempt }}
          path: |
            test-results.xml
            integration-test-results.xml
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  contracts:
    name: Generated contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Verify generated API models
        run: pnpm run generate:check

  container:
    name: Container smoke test
    needs:
      - quality
      - test
      - contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate maintained Compose files
        run: |
          docker compose --file templates/starter/docker-compose.yml config --quiet
          docker compose --file templates/examples/ticketing-yaml/docker-compose.yml config --quiet

      - name: Build container image
        run: docker build --pull --tag cloud-connector-ci:${GITHUB_SHA} .

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Run integration tests against the image
        run: pnpm run test:integration --reporter=default --reporter=junit --outputFile.junit=image-integration-test-results.xml
        env:
          INTEGRATION_TEST_IMAGE: cloud-connector-ci:${{ github.sha }}

      - name: Upload image integration test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-integration-test-results-${{ github.run_attempt }}
          path: image-integration-test-results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Start Cloud Connector
        run: |
          docker run --rm --detach \
            --name cloud-connector-ci \
            --publish 18080:8080 \
            --env CLOUD_CONNECTOR_HOST=https://cloud.example \
            --env CLOUD_CONNECTOR_CLIENT_ID=smoke-client \
            --env CLOUD_CONNECTOR_CLIENT_SECRET=smoke-secret \
            --env INTERNAL_API_TOKEN=smoke-target-secret \
            --volume "${PWD}/templates/starter/config:/config:ro" \
            cloud-connector-ci:${GITHUB_SHA}

      - name: Wait for a healthy container
        run: |
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' cloud-connector-ci)"
            if [[ "${status}" == "healthy" ]]; then
              curl --fail --silent --show-error http://localhost:18080/health
              exit 0
            fi
            if [[ "${status}" == "unhealthy" ]]; then
              exit 1
            fi
            sleep 1
          done
          exit 1

      - name: Show logs and remove smoke-test container
        if: always()
        run: |
          docker logs cloud-connector-ci || true
          docker rm --force cloud-connector-ci || true

  required:
    name: Required
    if: always()
    needs:
      - changesets
      - quality
      - test
      - contracts
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded
        env:
          CHANGESETS_RESULT: ${{ needs.changesets.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          [[ "${CHANGESETS_RESULT}" == "success" || "${CHANGESETS_RESULT}" == "skipped" ]]
          [[ "${QUALITY_RESULT}" == "success" ]]
          [[ "${TEST_RESULT}" == "success" ]]
          [[ "${CONTRACTS_RESULT}" == "success" ]]
          [[ "${CONTAINER_RESULT}" == "success" ]]

  publish-development:
    name: Publish development image
    if: always() && needs.required.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/serviceware/cloud-connector
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=dev
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          cache-from: type=gha,scope=development
          cache-to: type=gha,mode=max,scope=development
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

      - name: Verify authenticated image pulls by tag
        run: |
          for attempt in {1..12}; do
            if docker buildx imagetools inspect "${IMAGE_NAME}:sha-${GITHUB_SHA}" &&
              docker pull "${IMAGE_NAME}:sha-${GITHUB_SHA}"; then
              exit 0
            fi
            if [[ "${attempt}" == "12" ]]; then
              echo "Development image is not readable with the workflow's GHCR credentials." >&2
              exit 1
            fi
            sleep 5
          done

      - name: Add image details to workflow summary
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "## Published Cloud Connector development image" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo '```bash' >> "${GITHUB_STEP_SUMMARY}"
          echo "docker pull ${IMAGE_NAME}:dev" >> "${GITHUB_STEP_SUMMARY}"
          echo "docker pull ${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "GHCR authentication and package read access are required." >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "Immutable digest: \`${IMAGE_NAME}@${IMAGE_DIGEST}\`" >> "${GITHUB_STEP_SUMMARY}"
