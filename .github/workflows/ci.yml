name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changesets:
    name: Changeset status
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Dependabot needs a Changeset only when the update reaches the published image.
      - name: Decide whether a Changeset is required
        id: scope
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: origin/${{ github.base_ref }}
        run: |
          required=true
          if [[ "${AUTHOR}" == "dependabot[bot]" ]] &&
            git diff --quiet "${BASE}...HEAD" -- Dockerfile .node-version &&
            [[ "$(git show "${BASE}:package.json" | jq --sort-keys .dependencies)" == "$(jq --sort-keys .dependencies package.json)" ]]; then
            required=false
          fi
          echo "required=${required}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js and pnpm
        if: steps.scope.outputs.required == 'true'
        uses: ./.github/actions/setup-pnpm

      - name: Require a release or empty Changeset
        if: steps.scope.outputs.required == 'true'
        run: pnpm run changeset:status --since="origin/${{ github.base_ref }}"

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Check whitespace
        run: git diff --check

      - name: Check Node.js version matches the container image
        run: pnpm run node-version:check

      - name: Check release artifacts
        run: pnpm run release:check

      - name: Check formatting
        run: pnpm run fmt:check

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Run tests with coverage
        run: pnpm run test:coverage --reporter=default --reporter=junit --outputFile.junit=test-results.xml

      - name: Run integration tests
        run: pnpm run test:integration --reporter=default --reporter=junit --outputFile.junit=integration-test-results.xml

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_attempt }}
          path: |
            test-results.xml
            integration-test-results.xml
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  contracts:
    name: Generated contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Verify generated API models
        run: pnpm run generate:check

  container:
    name: Container smoke test
    needs:
      - quality
      - test
      - contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate maintained Compose files
        run: |
          docker compose --file templates/starter/docker-compose.yml config --quiet
          docker compose --file templates/examples/ticketing-yaml/docker-compose.yml config --quiet

      - name: Build container image
        run: docker build --pull --tag cloud-connector-ci:${GITHUB_SHA} .

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Run integration tests against the image
        run: pnpm run test:integration --reporter=default --reporter=junit --outputFile.junit=image-integration-test-results.xml
        env:
          INTEGRATION_TEST_IMAGE: cloud-connector-ci:${{ github.sha }}

      - name: Upload image integration test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-integration-test-results-${{ github.run_attempt }}
          path: image-integration-test-results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Start Cloud Connector
        run: |
          docker run --rm --detach \
            --name cloud-connector-ci \
            --publish 18080:8080 \
            --env CLOUD_CONNECTOR_HOST=https://cloud.example \
            --env CLOUD_CONNECTOR_CLIENT_ID=smoke-client \
            --env CLOUD_CONNECTOR_CLIENT_SECRET=smoke-secret \
            --env INTERNAL_API_TOKEN=smoke-target-secret \
            --volume "${PWD}/templates/starter/config:/config:ro" \
            cloud-connector-ci:${GITHUB_SHA}

      - name: Wait for a healthy container
        run: |
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' cloud-connector-ci)"
            if [[ "${status}" == "healthy" ]]; then
              curl --fail --silent --show-error http://localhost:18080/health
              exit 0
            fi
            if [[ "${status}" == "unhealthy" ]]; then
              exit 1
            fi
            sleep 1
          done
          exit 1

      - name: Show logs and remove smoke-test container
        if: always()
        run: |
          docker logs cloud-connector-ci || true
          docker rm --force cloud-connector-ci || true

  # Runs only where repository secrets are available and before an image is published.
  e2e:
    name: End-to-end tests
    if: github.event_name != 'pull_request'
    needs:
      - quality
      - test
      - contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build container image
        run: docker build --pull --tag cloud-connector-e2e:${GITHUB_SHA} .

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Run end-to-end tests against the image
        run: pnpm run test:e2e --reporter=default --reporter=junit --outputFile.junit=e2e-test-results.xml
        env:
          INTEGRATION_TEST_IMAGE: cloud-connector-e2e:${{ github.sha }}
          E2E_CLOUD_CONNECTOR_HOST: ${{ vars.E2E_CLOUD_CONNECTOR_HOST }}
          E2E_CLOUD_CONNECTOR_CLIENT_ID: ${{ vars.E2E_CLOUD_CONNECTOR_CLIENT_ID }}
          E2E_CLOUD_CONNECTOR_CLIENT_SECRET: ${{ secrets.E2E_CLOUD_CONNECTOR_CLIENT_SECRET }}

      - name: Upload end-to-end test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results-${{ github.run_attempt }}
          path: e2e-test-results.xml
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Required
    if: always()
    needs:
      - changesets
      - quality
      - test
      - contracts
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded
        env:
          CHANGESETS_RESULT: ${{ needs.changesets.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          [[ "${CHANGESETS_RESULT}" == "success" || "${CHANGESETS_RESULT}" == "skipped" ]]
          [[ "${QUALITY_RESULT}" == "success" ]]
          [[ "${TEST_RESULT}" == "success" ]]
          [[ "${CONTRACTS_RESULT}" == "success" ]]
          [[ "${CONTAINER_RESULT}" == "success" ]]

  publish:
    name: Publish image
    if: >-
      always() &&
      needs.required.result == 'success' &&
      needs.e2e.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs:
      - required
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/serviceware/cloud-connector
    outputs:
      release: ${{ steps.release.outputs.required }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A package.json version without its tag comes from a merged release pull request.
      - name: Detect an unreleased version
        id: release
        run: |
          version="$(jq --raw-output .version package.json)"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null || status=$?
          case "${status}" in
            0) required=false ;;
            2) required=true ;;
            *)
              echo "::error::Cannot read tag v${version} from origin (git ls-remote exit ${status})."
              exit 1
              ;;
          esac
          {
            echo "required=${required}"
            echo "version=${version}"
            echo "minor=${version%.*}"
            echo "major=${version%%.*}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release version has the highest priority so it becomes the image version label.
      - name: Create image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ steps.release.outputs.required }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.required }},priority=300
            type=raw,value=${{ steps.release.outputs.minor }},enable=${{ steps.release.outputs.required }}
            type=raw,value=${{ steps.release.outputs.major }},enable=${{ steps.release.outputs.required }}
            type=raw,value=dev
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          cache-from: type=gha,scope=development
          cache-to: type=gha,mode=max,scope=development
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

      - name: Verify authenticated multi-platform image
        env:
          RELEASE: ${{ steps.release.outputs.required }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          tags=(dev)
          if [[ "${RELEASE}" == "true" ]]; then
            tags+=("${VERSION}" latest)
          fi

          readable() {
            manifest="$(docker buildx imagetools inspect --raw "${IMAGE_NAME}:sha-${GITHUB_SHA}")" || return 1
            for tag in "${tags[@]}"; do
              [[ "$(docker buildx imagetools inspect --raw "${IMAGE_NAME}:${tag}")" == "${manifest}" ]] || return 1
            done
            docker pull "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          }

          for attempt in {1..12}; do
            if readable; then
              break
            fi
            if [[ "${attempt}" == "12" ]]; then
              echo "Published tags are not readable as the same image with the workflow's GHCR credentials." >&2
              exit 1
            fi
            sleep 5
          done

          platforms="$(jq --compact-output '
            [.manifests[].platform
              | select(.os == "linux")
              | "\(.os)/\(.architecture)"]
            | unique
            | sort
          ' <<< "${manifest}")"
          [[ "${platforms}" == '["linux/amd64","linux/arm64"]' ]]

      - name: Start published release image
        if: steps.release.outputs.required == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker run --rm --detach \
            --name cloud-connector-release-smoke \
            --publish 18080:8080 \
            --env CLOUD_CONNECTOR_HOST=https://cloud.example \
            --env CLOUD_CONNECTOR_CLIENT_ID=smoke-client \
            --env CLOUD_CONNECTOR_CLIENT_SECRET=smoke-secret \
            --env INTERNAL_API_TOKEN=smoke-target-secret \
            --volume "${PWD}/templates/starter/config:/config:ro" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify published release image health
        if: steps.release.outputs.required == 'true'
        run: |
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' cloud-connector-release-smoke)"
            if [[ "${status}" == "healthy" ]]; then
              curl --fail --silent --show-error http://localhost:18080/health
              exit 0
            fi
            if [[ "${status}" == "unhealthy" ]]; then
              exit 1
            fi
            sleep 1
          done
          exit 1

      - name: Show logs and remove release smoke-test container
        if: always() && steps.release.outputs.required == 'true'
        run: |
          docker logs cloud-connector-release-smoke || true
          docker rm --force cloud-connector-release-smoke || true

      - name: Add image details to workflow summary
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          RELEASE: ${{ steps.release.outputs.required }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "${RELEASE}" == "true" ]]; then
            echo "## Published Cloud Connector ${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "## Published Cloud Connector development image" >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo '```bash' >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${RELEASE}" == "true" ]]; then
            echo "docker pull ${IMAGE_NAME}:${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo "docker pull ${IMAGE_NAME}:dev" >> "${GITHUB_STEP_SUMMARY}"
          echo "docker pull ${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "GHCR authentication and package read access are required." >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "Immutable digest: \`${IMAGE_NAME}@${IMAGE_DIGEST}\`" >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: Create GitHub release
    needs: publish
    if: needs.publish.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - name: Tag the release commit and publish the GitHub release
        run: |
          tag="v${VERSION}"
          if ! gh release view "${tag}" > /dev/null 2>&1; then
            gh release create "${tag}" \
              --target "${GITHUB_SHA}" \
              --title "Cloud Connector ${VERSION}" \
              --notes "Private container image (GHCR authentication required): ghcr.io/serviceware/cloud-connector:${VERSION}" \
              --generate-notes
          fi
