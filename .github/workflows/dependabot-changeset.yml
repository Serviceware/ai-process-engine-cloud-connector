name: Dependabot Changeset

on:
  pull_request:
    types:
      - opened

permissions: {}

jobs:
  add-empty-changeset:
    name: Add empty Changeset
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Dependabot tokens are read-only unless granted here.
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # Written without pnpm so bumped dependencies never run with a write token.
      - name: Commit empty Changeset
        run: |
          printf -- '---\n\n---\n' > ".changeset/dependabot-${PR_NUMBER}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".changeset/dependabot-${PR_NUMBER}.md"
          git commit --message "chore: add empty Changeset"
          git push origin "HEAD:refs/heads/${HEAD_REF}"

      # Pushes with GITHUB_TOKEN start no pull_request run, so the required check needs a dispatch.
      - name: Run CI for the new commit
        run: gh workflow run ci.yml --ref "${HEAD_REF}"
