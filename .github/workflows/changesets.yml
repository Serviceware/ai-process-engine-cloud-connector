name: Release pull request

on:
  workflow_dispatch:

concurrency:
  group: release-pull-request
  cancel-in-progress: false

permissions: {}

jobs:
  release-pull-request:
    name: Create or update release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require the main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "${RELEASE_REF}" != "refs/heads/main" ]]; then
            echo "::error::Run the release pull request workflow on main, not ${RELEASE_REF}."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Prepare version and release artifacts
        run: pnpm run release:version

      # Empty Changesets alone do not release; they stay until the next release consumes them.
      - name: Create or update the release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- package.json; then
            echo "::notice::No release Changesets are pending; nothing to release."
            exit 0
          fi

          version="$(jq --raw-output .version package.json)"
          title="chore: release Cloud Connector ${version}"
          body="Apply pending Changesets and prepare Cloud Connector ${version}. Merging this pull request publishes the release from CI on main. CI runs for this pull request wait for approval because the workflow token opened it."
          release_branch="changeset-release/main"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${release_branch}:refs/remotes/origin/${release_branch}" || true
          git switch --create "${release_branch}"
          git add --all
          git commit --message "${title}"
          git push --force-with-lease origin "HEAD:refs/heads/${release_branch}"

          pr_url="$(gh pr list \
            --base main \
            --head "${release_branch}" \
            --state open \
            --json url \
            --jq '.[0].url // empty')"
          if [[ -z "${pr_url}" ]]; then
            gh pr create --base main --head "${release_branch}" --title "${title}" --body "${body}"
          else
            gh pr edit "${pr_url}" --title "${title}" --body "${body}"
          fi
