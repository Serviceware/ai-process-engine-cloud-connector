name: Changesets release management

on:
  workflow_dispatch:

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify main
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  changesets:
    name: Version or tag release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Create release pull request or tag release
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: deno task release:version
          publish: deno task release:tag
          commit: "chore: release Cloud Connector"
          title: "chore: release Cloud Connector"
          createGithubReleases: true

      - name: Read released Cloud Connector version
        id: release
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          version="$(jq --exit-status --raw-output '
            map(select(.name == "@serviceware/cloud-connector"))
            | if length == 1 then .[0].version else error("Cloud Connector release missing") end
          ' <<< "${PUBLISHED_PACKAGES}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  publish-container:
    name: Publish released container
    needs: changesets
    if: needs.changesets.outputs.published == 'true'
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.changesets.outputs.version }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
