name: Promote release to latest

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released semantic version, with or without the v prefix
        required: true
        type: string

concurrency:
  group: promote-latest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Promote published digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/serviceware/cloud-connector
    steps:
      - name: Validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote immutable release to latest
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${VERSION}"
          docker buildx imagetools inspect "${IMAGE_NAME}:latest"
