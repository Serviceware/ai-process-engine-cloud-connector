# AD User Export Deployment
# =========================
#
# Start: docker-compose up -d
# Logs:    docker-compose logs -f
# Stop:    docker-compose down

services:
  # ==========================================================================
  # Cloud Connector
  # Connects to the Serviceware Cloud and runs functions
  # ==========================================================================
  cloud-connector:
    image: ghcr.io/serviceware/cloud-connector:3.0.0
    container_name: ad-cloud-connector
    restart: always
    ports:
      - "8080:8080"
    environment:
      # WebSocket URL for the Serviceware Cloud
      - CLOUD_CONNECTOR_WS_URL=${SERVICEWARE_WS_URL}
      - CLOUD_CONNECTOR_HOST=${SERVICEWARE_HOST}
      - CLOUD_CONNECTOR_CLIENT_ID=${SERVICEWARE_CLIENT_ID}
      - CLOUD_CONNECTOR_CLIENT_SECRET=${SERVICEWARE_CLIENT_SECRET}
      - CLOUD_CONNECTOR_LOG_LEVEL=${SERVICEWARE_LOG_LEVEL:-info}
      - OUTBOUND_URL_ALLOWLIST=${OUTBOUND_URL_ALLOWLIST:-[]}

      # Function mode: path to the functions directory
      - CLOUD_CONNECTOR_FUNCTIONS_DIR=/functions

      # Bridge API configuration (available to the functions)
      - AD_BRIDGE_URL=http://ad-bridge:5000
      - AD_BRIDGE_TOKEN=${BRIDGE_API_TOKEN}

    volumes:
      - ./functions:/functions:ro

    depends_on:
      ad-bridge:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================================================
  # AD Bridge API
  # REST API that runs LDAP queries against Active Directory
  # ==========================================================================
  ad-bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: ad-bridge-api
    restart: unless-stopped
    # Port is reachable internally only (not exposed externally)
    expose:
      - "5000"
    environment:
      # Active Directory connection
      - AD_SERVER=${AD_SERVER}
      - AD_BASE_DN=${AD_BASE_DN}
      - AD_BIND_USER=${AD_BIND_USER}
      - AD_BIND_PASSWORD=${AD_BIND_PASSWORD}

      # API authentication
      - BRIDGE_API_TOKEN=${BRIDGE_API_TOKEN}

      # Optional: TLS for LDAP
      - AD_USE_TLS=${AD_USE_TLS:-false}
      - AD_CERT_FILE=${AD_CERT_FILE:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: ad-connector-network
