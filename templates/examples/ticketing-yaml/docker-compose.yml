# Ticketing Integration Deployment (YAML forwarding)
# ==================================================
#
# Start: docker-compose up -d
# Logs:    docker-compose logs -f
# Stop:    docker-compose down

services:
  cloud-connector:
    image: ghcr.io/serviceware/cloud-connector:3.0.0
    container_name: ticketing-cloud-connector
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Serviceware Cloud host and OAuth credentials stay outside the volume.
      - CLOUD_CONNECTOR_HOST=${SERVICEWARE_HOST}
      - CLOUD_CONNECTOR_CLIENT_ID=${SERVICEWARE_CLIENT_ID}
      - CLOUD_CONNECTOR_CLIENT_SECRET=${SERVICEWARE_CLIENT_SECRET}

      # Ticketing API secret referenced by cloud-connector.yml
      - TICKET_API_TOKEN=${TICKET_API_TOKEN}

    volumes:
      # Complete hot-reloadable operating configuration.
      - ./config:/config:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
