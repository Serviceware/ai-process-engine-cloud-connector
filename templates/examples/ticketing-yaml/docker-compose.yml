# Ticketing Integration Deployment (YAML Functions)
# ================================================
#
# Start: docker-compose up -d
# Logs:    docker-compose logs -f
# Stop:    docker-compose down

services:
  cloud-connector:
    image: ghcr.io/serviceware/cloud-connector:latest
    container_name: ticketing-cloud-connector
    restart: always
    ports:
      - "8080:8080"
    environment:
      # WebSocket URL for the Serviceware Cloud
      - CLOUD_CONNECTOR_WS_URL=${SERVICEWARE_WS_URL}
      - CLOUD_CONNECTOR_HOST=${SERVICEWARE_HOST}
      - CLOUD_CONNECTOR_CLIENT_ID=${SERVICEWARE_CLIENT_ID}
      - CLOUD_CONNECTOR_CLIENT_SECRET=${SERVICEWARE_CLIENT_SECRET}
      - CLOUD_CONNECTOR_LOG_LEVEL=${SERVICEWARE_LOG_LEVEL:-info}

      # Function mode: path to the functions directory
      - CLOUD_CONNECTOR_FUNCTIONS_DIR=/functions

      # Ticketing API configuration (available to YAML functions)
      - TICKET_API_URL=${TICKET_API_URL}
      - TICKET_API_TOKEN=${TICKET_API_TOKEN}

    volumes:
      # Functions directory (YAML and/or TypeScript)
      - ./functions:/functions:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
