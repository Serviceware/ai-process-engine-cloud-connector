# yaml-language-server: $schema=../../../../schemas/cloud-connector.schema.json

connection:
  websocketUrl: wss://cloud.serviceware.se/connector/ws?tenant=your-tenant
  heartbeatIntervalSeconds: 30

logging:
  level: info

# One declarative forwarding target for every workload request.
forwarding:
  target: http://ticketing-api:3000
  outboundUrlAllowlist:
    - "^http://ticketing-api:3000(?:/|$)"
  timeout: 30000

  request:
    headers:
      set:
        authorization: "Bearer {{ env.TICKET_API_TOKEN }}"
        x-api-version: "2.0"
        accept: "application/json"
      add:
        x-request-id: "{{ context.requestId }}"
        x-timestamp: "{{ context.startedAt }}"
      remove:
        - x-forwarded-for
        - x-real-ip
    pathPrefix: "/api/v2"

  response:
    headers:
      add:
        x-request-id: "{{ context.requestId }}"
      remove:
        - server
        - x-powered-by
