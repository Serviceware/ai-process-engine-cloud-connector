# yaml-language-server: $schema=../../../schemas/forwarding.schema.json

# One declarative forwarding target for every workload request.
target: "{{ env.TICKET_API_URL }}"
timeout: 30000

request:
  headers:
    set:
      authorization: "Bearer {{ env.TICKET_API_TOKEN }}"
      x-api-version: "2.0"
      accept: "application/json"
    add:
      x-request-id: "{{ context.requestId }}"
      x-timestamp: "{{ context.startedAt }}"
    remove:
      - x-forwarded-for
      - x-real-ip
  pathPrefix: "/api/v2"

response:
  headers:
    add:
      x-request-id: "{{ context.requestId }}"
    remove:
      - server
      - x-powered-by
