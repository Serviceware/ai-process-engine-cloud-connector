# ERP Integration Deployment
# ==========================
#
# Start: docker-compose up -d
# Logs:    docker-compose logs -f
# Stop:    docker-compose down

services:
  cloud-connector:
    image: ghcr.io/serviceware/cloud-connector:3.0.0
    container_name: erp-cloud-connector
    restart: always
    ports:
      - "8080:8080"
    environment:
      # WebSocket URL for the Serviceware Cloud
      - CLOUD_CONNECTOR_WS_URL=${SERVICEWARE_WS_URL}
      - CLOUD_CONNECTOR_HOST=${SERVICEWARE_HOST}
      - CLOUD_CONNECTOR_CLIENT_ID=${SERVICEWARE_CLIENT_ID}
      - CLOUD_CONNECTOR_CLIENT_SECRET=${SERVICEWARE_CLIENT_SECRET}
      - CLOUD_CONNECTOR_LOG_LEVEL=${SERVICEWARE_LOG_LEVEL:-info}
      - OUTBOUND_URL_ALLOWLIST=${OUTBOUND_URL_ALLOWLIST:-[]}

      # Function mode: path to the functions directory
      - CLOUD_CONNECTOR_FUNCTIONS_DIR=/functions

      # SAP connection (available to the functions)
      - ERP_URL=${ERP_URL}
      - ERP_USER=${ERP_USER}
      - ERP_PASSWORD=${ERP_PASSWORD}
      - ERP_SYSTEM=${ERP_SYSTEM:-PRD}

    volumes:
      - ./functions:/functions:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
