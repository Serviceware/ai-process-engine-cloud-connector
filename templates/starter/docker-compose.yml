# Cloud Connector Deployment
# ==========================
#
# Start: docker compose up -d
# Logs:    docker compose logs -f
# Stop:    docker compose down   (the only intended stop path)
#
# restart: always => the container restarts automatically after crashes, OOMs,
# daemon restarts, and host reboots. Only "docker compose down" stops it
# permanently.

services:
  cloud-connector:
    image: ghcr.io/serviceware/cloud-connector:0.1.0
    container_name: serviceware-cloud-connector
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Required: replace these placeholders with values provided by
      # Serviceware. Do not commit real credentials.
      CLOUD_CONNECTOR_HOST: "https://your-serviceware-cloud.example"
      CLOUD_CONNECTOR_CLIENT_ID: "your-client-id"
      CLOUD_CONNECTOR_CLIENT_SECRET: "your-client-secret"

      # Optional safety limits. These values match the runtime defaults.
      CLOUD_CONNECTOR_MAX_CONCURRENT_REQUESTS: "100"
      CLOUD_CONNECTOR_MAX_RESPONSE_BODY_BYTES: "10485760"
      CLOUD_CONNECTOR_DRAIN_TIMEOUT_SECONDS: "30"

      # Target secret referenced by config/cloud-connector.yml.
      INTERNAL_API_TOKEN: "your-secret-api-token"

    volumes:
      # Complete hot-reloadable operating configuration.
      - ./config:/config:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Covers the initial WebSocket connection setup
      start_period: 15s
