# Cloud Connector Deployment
# ==========================
#
# Start: docker-compose up -d
# Logs:    docker-compose logs -f
# Stop:    docker-compose down   (the only intended stop path)
#
# restart: always => the container restarts automatically after crashes, OOMs,
# daemon restarts, and host reboots. Only "docker compose down" stops it
# permanently.

services:
  cloud-connector:
    image: ghcr.io/serviceware/cloud-connector:0.1.0
    container_name: serviceware-cloud-connector
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Serviceware Cloud host and OAuth credentials stay outside the volume.
      - CLOUD_CONNECTOR_HOST=${SERVICEWARE_HOST}
      - CLOUD_CONNECTOR_CLIENT_ID=${SERVICEWARE_CLIENT_ID}
      - CLOUD_CONNECTOR_CLIENT_SECRET=${SERVICEWARE_CLIENT_SECRET}
      - CLOUD_CONNECTOR_MAX_CONCURRENT_REQUESTS=${CLOUD_CONNECTOR_MAX_CONCURRENT_REQUESTS:-100}
      - CLOUD_CONNECTOR_MAX_RESPONSE_BODY_BYTES=${CLOUD_CONNECTOR_MAX_RESPONSE_BODY_BYTES:-10485760}
      - CLOUD_CONNECTOR_DRAIN_TIMEOUT_SECONDS=${CLOUD_CONNECTOR_DRAIN_TIMEOUT_SECONDS:-30}

      # Secrets referenced by cloud-connector.yml also stay in the environment.
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}

    volumes:
      # Complete hot-reloadable operating configuration.
      - ./config:/config:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Covers the initial WebSocket connection setup
      start_period: 15s
