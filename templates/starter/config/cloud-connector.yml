# yaml-language-server: $schema=../../../schemas/cloud-connector.schema.json

# Runtime settings in this mounted file are hot-reloaded.
connection:
  heartbeatIntervalSeconds: 30

logging:
  level: info

# Rules match the complete URL requested by Serviceware Cloud. Later matching
# rules override earlier explicit values. No match means deny.
forwarding:
  - target: "^http://your-internal-api:3000(?:/|$)"
    methods: [GET, POST]
    timeout: 30000
    request:
      auth:
        type: bearer
        token: "{{ env.INTERNAL_API_TOKEN }}"
      headers:
        add:
          x-request-id: "{{ context.requestId }}"
        remove:
          - x-forwarded-for
          - x-real-ip
    response:
      headers:
        remove:
          - server
          - x-powered-by
