# yaml-language-server: $schema=../../../schemas/cloud-connector.schema.json

# Runtime settings in this mounted file are hot-reloaded. A connection-level
# change reconnects the socket; forwarding and logging changes apply in place.
connection:
  websocketUrl: wss://cloud.serviceware.se/connector/ws?tenant=your-tenant
  heartbeatIntervalSeconds: 30

logging:
  level: info

# Every workload request is forwarded to this one target. The inbound path and
# query string are preserved; an optional static pathPrefix may be added.
forwarding:
  target: http://your-internal-api:3000
  outboundUrlAllowlist:
    - "^http://your-internal-api:3000(?:/|$)"
  timeout: 30000

  request:
    headers:
      set:
        authorization: "Bearer {{ env.INTERNAL_API_TOKEN }}"
      add:
        x-request-id: "{{ context.requestId }}"
      remove:
        - x-forwarded-for
        - x-real-ip

  response:
    headers:
      remove:
        - server
        - x-powered-by
